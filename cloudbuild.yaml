# Builds the Dockerfile and deploys it to Cloud Run. The "deploy-main" Cloud
# Build trigger runs this on every push to main. To run it by hand:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_IMAGE=us-east4-docker.pkg.dev/ruthai26nyc-2612/cloud-run-source-deploy/good-riddance:manual
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '$_IMAGE', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '$_IMAGE']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ['run', 'deploy', 'good-riddance', '--image', '$_IMAGE', '--region', 'us-east4', '--quiet']
substitutions:
  _IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/good-riddance:${COMMIT_SHA}
options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
